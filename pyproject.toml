[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rialto-terminal"
version = "1.0.0"
description = "Rialto — a real-time terminal for global markets, newswires, vessel and aircraft tracking."
readme = "README.md"
requires-python = ">=3.10"
# Deliberately empty: the backend runs on the Python standard library alone
# (http.server, urllib, html.parser, xml, concurrent.futures). That is a
# feature, not an omission — see requirements.txt.
dependencies = []

[project.scripts]
# After `pip install -e .` the server starts with the `rialto` command.
rialto = "server.app:main"

[tool.setuptools.packages.find]
include = ["server*"]
